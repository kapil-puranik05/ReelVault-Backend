services:
  - type: web
    name: reelvault-backend2
    runtime: python
    plan: free
    rootDir: backend2
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.5
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_VISION_MODEL
        value: gemini-flash-lite-latest
      - key: GEMINI_AUDIO_MODEL
        value: gemini-flash-lite-latest
      - key: GEMINI_TEXT_MODEL
        value: gemini-flash-lite-latest
      - key: GEMINI_EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: EMBEDDING_OUTPUT_DIM
        value: "768"
      - key: SAMPLE_FPS
        value: "1.0"
      - key: MAX_FRAMES
        value: "120"
      - key: FRAME_WIDTH
        value: "768"
      - key: FRAMES_PER_VISION_BATCH
        value: "20"
      - key: DRY_RUN
        value: "false"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: TRIAL_DURATION_DAYS
        value: "7"
      - key: PAID_PLAN_PRICE
        value: "1"
      - key: PAID_PLAN_CURRENCY
        value: INR
      - key: REEL_SAVE_PRICE
        value: "40"
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
